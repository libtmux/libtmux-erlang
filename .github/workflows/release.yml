name: Hex release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/RELEASE.md'
      - 'rebar.config'
      - '.tool-versions'
      - 'apps/libtmux_erlang/**'
      - 'scripts/docs/**'
      - 'scripts/lib/**'
      - 'tools/docs-tool.json'
      - 'scripts/release/**'
      - 'scripts/package/**'
  workflow_dispatch:
    inputs:
      verify_identity:
        description: Verify Hex workload identity without publishing
        type: boolean
        default: false
      verify_publication_run:
        description: Run ID of the tag submission to verify after Hex approval
        type: string
      check_ubuntu_tmux:
        description: Run the pane-exit example with Ubuntu's packaged tmux
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    hex-release-${{ github.event_name == 'push' && 'publish' ||
      github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  ERL_FLAGS: '+S 4:4'

jobs:
  identity:
    name: Verify Hex workload identity without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: hexpm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Load the pinned Hex publisher
        run: rebar3 as release version
      - name: Exchange and revoke a package-scoped token
        run: escript scripts/release/check_hex_identity.erl

  candidate:
    name: Build package and native docs without publishing
    if: ${{ !inputs.verify_identity && !inputs.verify_publication_run && !inputs.check_ubuntu_tmux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Test the release checks
        run: rebar3 eunit --module=check_release_tests,publish_hex_tests,check_hex_install_tests
      - name: Validate release source
        id: metadata
        run: escript scripts/release/check_release.erl --from-actions
      - name: Prepare pinned documentation tools
        run: escript scripts/docs/build_docs.erl --prepare
      - name: Build EEP-48 documentation
        run: escript scripts/docs/build_docs.erl
      - name: Build source package
        run: rebar3 as release hex build package --app libtmux_erlang
      - name: Name the candidate package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: cp "_build/release/lib/libtmux_erlang/hex/libtmux_erlang-$VERSION.tar" _build/libtmux_erlang-release.tar
      - name: Exercise combined submission without credentials or upload
        run: rebar3 as release hex publish --yes --dry-run --doc-dir "$PWD/_build/docs/core"
      - name: Retain candidate package and docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-candidate
          path: |
            _build/libtmux_erlang-release.tar
            _build/docs/core
            _build/checks/docs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Qualify exact tag on supported endpoints
    needs: candidate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Submit qualified tag to Hex
    needs: [candidate, qualify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: hexpm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-candidate
          path: _build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checks-ubuntu-24.04-tmux-3.8
          path: _build/qualified
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Bind candidate to exact native source qualification
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          escript scripts/release/check_release.erl \
            --tag "$TAG" \
            --artifact _build/libtmux_erlang-release.tar \
            --qualified-receipt _build/qualified/source-package-check/receipt.json
      - name: Rebuild the source package
        run: rebar3 as release hex build package --app libtmux_erlang
      - name: Verify reproducible publisher input
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: cmp _build/libtmux_erlang-release.tar "_build/release/lib/libtmux_erlang/hex/libtmux_erlang-$VERSION.tar"
      - name: Submit package and prebuilt docs
        env:
          ALREADY_PUBLISHED: ${{ steps.release.outputs.published }}
        run: escript scripts/release/publish_hex.erl --published "$ALREADY_PUBLISHED"

  verify:
    name: Verify an approved Hex release
    if: github.event_name == 'workflow_dispatch' && inputs.verify_publication_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the verification workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Keep the workflow's verifier when checking an older tag
        run: install -D -m 0644 scripts/release/check_release.erl "$RUNNER_TEMP/erlang-release/check_release.erl"
      - name: Identify the tag push and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_RUN: ${{ inputs.verify_publication_run }}
        run: escript scripts/release/check_release.erl --submission-run "$SUBMISSION_RUN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verify_publication_run }}
          path: _build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checks-ubuntu-24.04-tmux-3.8
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verify_publication_run }}
          path: _build/qualified
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Verify the public tarball against native source qualification
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_HEAD: ${{ steps.release.outputs.head }}
        run: |
          escript "$RUNNER_TEMP/erlang-release/check_release.erl" \
            --checkout "$PWD" \
            --tag "$TAG" \
            --submitted-head "$RELEASE_HEAD" \
            --artifact _build/libtmux_erlang-release.tar \
            --qualified-receipt _build/qualified/source-package-check/receipt.json \
            --require-published
      - name: Verify versioned HexDocs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: escript "$RUNNER_TEMP/erlang-release/check_release.erl" --hexdocs "$VERSION"
      - name: Build pinned tmux 3.8
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: '3.8'
      - name: Run the quickstart from a clean public install
        env:
          VERSION: ${{ steps.release.outputs.version }}
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: escript scripts/package/check_hex_install.erl "$VERSION"
      - name: Preserve public install receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-public-install
          path: _build/checks/hex-install.json
          if-no-files-found: warn
          retention-days: 14

  ubuntu-tmux:
    name: Check pane exit on Ubuntu's packaged tmux
    if: github.event_name == 'workflow_dispatch' && inputs.check_ubuntu_tmux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LIBTMUX_TEST_TMUX: /usr/bin/tmux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install Ubuntu's tmux and the compiler
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends build-essential tmux
      - name: Record the installed tmux package version
        run: dpkg-query -W tmux
      - name: Compile the library
        run: rebar3 compile
      - name: Run the pane-exit example
        run: escript scripts/check/run_examples.escript job
      - name: Preserve the example receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-packaged-tmux
          path: _build/checks/examples.json
          if-no-files-found: warn
          retention-days: 14
