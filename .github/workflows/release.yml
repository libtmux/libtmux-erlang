name: Hex release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/RELEASE.md'
      - 'rebar.config'
      - '.tool-versions'
      - 'apps/libtmux_erlang/**'
      - 'scripts/docs/**'
      - 'scripts/lib/**'
      - 'tools/docs-tool.json'
      - 'scripts/release/**'
      - 'scripts/package/**'
  workflow_dispatch:
    inputs:
      verify_identity:
        description: Verify Hex workload identity without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hex-release-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  ERL_FLAGS: '+S 4:4'

jobs:
  identity:
    name: Verify Hex workload identity without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: hexpm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Load the pinned Hex publisher
        run: rebar3 as release version
      - name: Exchange and revoke a package-scoped token
        run: escript scripts/release/check_hex_identity.erl

  candidate:
    name: Build package and native docs without publishing
    if: ${{ !inputs.verify_identity }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Test the release checks
        run: rebar3 eunit --module check_release_tests
      - name: Validate release source
        id: metadata
        run: escript scripts/release/check_release.erl --from-actions
      - name: Prepare pinned documentation tools
        run: escript scripts/docs/build_docs.erl --prepare
      - name: Build EEP-48 documentation
        run: escript scripts/docs/build_docs.erl
      - name: Build source package
        run: rebar3 as release hex build package --app libtmux_erlang
      - name: Name the candidate package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: cp "_build/release/lib/libtmux_erlang/hex/libtmux_erlang-$VERSION.tar" _build/libtmux_erlang-release.tar
      - name: Exercise the package publisher without credentials or upload
        run: rebar3 as release hex publish package --app libtmux_erlang --yes --dry-run
      - name: Exercise the documentation publisher without credentials or upload
        run: rebar3 as release hex publish docs --app libtmux_erlang --yes --dry-run --doc-dir "$PWD/_build/docs/core"
      - name: Retain candidate package and docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-candidate
          path: |
            _build/libtmux_erlang-release.tar
            _build/docs/core
            _build/checks/docs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Qualify exact tag on supported endpoints
    needs: candidate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish qualified tag to Hex
    needs: [candidate, qualify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hexpm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-candidate
          path: _build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checks-ubuntu-24.04-tmux-3.8
          path: _build/qualified
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Bind candidate to exact native source qualification
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          escript scripts/release/check_release.erl \
            --tag "$TAG" \
            --artifact _build/libtmux_erlang-release.tar \
            --qualified-receipt _build/qualified/source-package-check/receipt.json
      - name: Rebuild the source package
        run: rebar3 as release hex build package --app libtmux_erlang
      - name: Verify reproducible publisher input
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: cmp _build/libtmux_erlang-release.tar "_build/release/lib/libtmux_erlang/hex/libtmux_erlang-$VERSION.tar"
      - name: Publish package and prebuilt docs
        env:
          ALREADY_PUBLISHED: ${{ steps.release.outputs.published }}
        run: escript scripts/release/publish_hex.erl --published "$ALREADY_PUBLISHED"
      - name: Verify public artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          escript scripts/release/check_release.erl \
            --tag "$TAG" \
            --artifact _build/libtmux_erlang-release.tar \
            --require-published

  install:
    name: Install public Hex package without publisher credentials
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install consumer prerequisites
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends build-essential tmux
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Install and execute public package
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: escript scripts/package/check_hex_install.erl "$VERSION"
      - name: Verify HexDocs is public
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: curl --fail --silent --show-error --output /dev/null "https://hexdocs.pm/libtmux_erlang/$VERSION/"
      - name: Preserve public install receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-public-install
          path: _build/checks/hex-install.json
          if-no-files-found: warn
          retention-days: 14
