name: docs

# Build a selected source revision with the shared native Erlang producer.
# Production publication remains an explicit manual choice. Ready, same-repo
# pull requests may publish previews. Keep both reusable workflow pins equal.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact source ref to build
        required: true
        default: master
      version:
        description: URL version slug
        required: true
        default: latest
      version-kind:
        description: Version policy
        required: true
        type: choice
        options: [trunk, tag, alias]
        default: trunk
      is-default:
        description: Make this version canonical
        required: true
        type: boolean
        default: false
      resolves-to:
        description: Immutable target for an alias
        required: false
        default: ''
      publish:
        description: Publish after the exact build passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.repository }}
  queue: max

jobs:
  build:
    uses: libtmux/docs/.github/workflows/port-docs.yml@6e6cbd8342476ee18aafb532cd14597ed3a90700
    with:
      port: erlang
      tag-prefix: ''
      publish-previews: >-
        ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && !github.event.pull_request.draft
          && !contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      source-ref: ${{ inputs.source-ref }}
      version: ${{ inputs.version }}
      version-kind: ${{ inputs.version-kind }}
      is-default: ${{ inputs.is-default == true }}
      resolves-to: ${{ inputs.resolves-to }}
      publish: ${{ inputs.publish == true }}

  publish:
    needs: build
    if: needs.build.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: libtmux/docs/.github/workflows/reusable-deploy.yml@6e6cbd8342476ee18aafb532cd14597ed3a90700
    with:
      path-prefix: erlang/${{ matrix.version }}
      artifact: docs-erlang-${{ matrix.version }}
      version-kind: ${{ matrix.kind }}
      require-current-pr: true
      port: erlang
      version: ${{ matrix.version }}
      label: ${{ matrix.version }}
      is-default: ${{ matrix.isDefault }}
      resolves-to: ${{ matrix.resolvesTo }}
      environment: ${{ matrix.kind == 'pr' && 'docs-preview' || 'docs' }}
    secrets:
      role-arn: ${{ secrets[matrix.kind == 'pr' && 'LIBTMUX_DOCS_PREVIEW_ROLE_ARN' || 'LIBTMUX_DOCS_ROLE_ARN'] }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}
