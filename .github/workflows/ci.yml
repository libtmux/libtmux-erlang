name: Erlang checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: erlang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ERL_FLAGS: '+S 4:4'

jobs:
  native:
    name: OTP 29 / tmux ${{ matrix.tmux }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
      - name: Select the built tmux
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: echo "LIBTMUX_TEST_TMUX=$TMUX_BINARY" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/default/*_plt
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.rebar3-version }}-${{ hashFiles('rebar.config', 'rebar.lock', 'apps/*/src/*.app.src') }}
      - name: Print the OTP, ERTS and Rebar3 versions
        run: rebar3 version
      - name: Print the tmux version
        run: '"$LIBTMUX_TEST_TMUX" -V'
      - name: Print the tmux binary checksum
        run: sha256sum "$LIBTMUX_TEST_TMUX"
      - name: Prepare test dependencies
        run: rebar3 as test compile
      - name: Check example width
        uses: libtmux/.github/actions/check-example-width@bd3bae79572512da032287202d74c8da03b5967b
      - name: Unit, generated-source and whitespace checks
        run: escript scripts/check/check.erl mid
      - name: Measure whole child VM and escript startup
        run: escript scripts/check/measure_startup.erl
      - name: Compile, helper, Dialyzer, owned integration and archive consumer
        run: escript scripts/check/check.erl outer
      - name: Prepare pinned source-package tools
        run: escript scripts/package/check_source_package.erl --prepare
      - name: Build and install exact Hex source artifacts
        run: escript scripts/package/check_source_package.erl
      - name: Preserve the archive consumer's tmux server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmux-log-${{ matrix.runner }}-tmux-${{ matrix.tmux }}
          path: _build/tmux-log
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve check receipts and integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.runner }}-tmux-${{ matrix.tmux }}
          path: |
            _build/checks
            _build/test/logs
            _build/package-check/receipt.json
            _build/source-package-check
          if-no-files-found: warn
          retention-days: 14

  daemon-floor:
    name: Refuse tmux ${{ matrix.daemon }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        daemon: ['3.0a', '3.1c', '3.2a', '3.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Build the older tmux daemon
        id: daemon
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.daemon }}
      - name: Keep the daemon executable for the mixed-client test
        env:
          BUILT_TMUX: ${{ steps.daemon.outputs.binary }}
        run: install -D -m 0755 "$BUILT_TMUX" "$RUNNER_TEMP/erlang-floor-daemon/tmux"
      - name: Build the 3.3a client
        id: client
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: '3.3a'
      - name: Print the tmux binary checksums
        env:
          BUILT_CLIENT: ${{ steps.client.outputs.binary }}
        run: sha256sum "$RUNNER_TEMP/erlang-floor-daemon/tmux" "$BUILT_CLIENT"
      - name: Compile the private fixture
        run: rebar3 as test compile
      - name: Check refusal and unchanged daemon state
        env:
          BUILT_CLIENT: ${{ steps.client.outputs.binary }}
          DAEMON_RELEASE: ${{ matrix.daemon }}
        run: >-
          escript test/check_daemon_floor.erl
          "$RUNNER_TEMP/erlang-floor-daemon/tmux"
          "$BUILT_CLIENT" "$DAEMON_RELEASE" 3.3a
      - name: Check refusal with a matching older client
        if: matrix.daemon == '3.2a' || matrix.daemon == '3.3'
        env:
          DAEMON_RELEASE: ${{ matrix.daemon }}
        run: >-
          escript test/check_daemon_floor.erl
          "$RUNNER_TEMP/erlang-floor-daemon/tmux"
          "$RUNNER_TEMP/erlang-floor-daemon/tmux"
          "$DAEMON_RELEASE" "$DAEMON_RELEASE"
      - name: Preserve the refusal receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon-floor-${{ matrix.daemon }}
          path: _build/checks/daemon-floor-*.json
          if-no-files-found: warn
          retention-days: 14

  native-helper:
    name: Native helper sanitizers / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install instrumented native toolchain
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends clang-18 libclang-rt-18-dev
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Check helper lifecycle and framed-input parser
        run: escript scripts/helper/check_helper_native.erl
      - name: Preserve sanitizer logs and crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-helper-${{ matrix.runner }}
          path: _build/checks/helper-native
          if-no-files-found: warn
          retention-days: 14

  properties:
    name: Generated filter properties
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Prepare isolated test dependencies
        run: rebar3 as property,test get-deps
      - name: Run PropEr properties
        run: escript scripts/check/check.erl properties
      - name: Preserve property counterexamples and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-properties
          path: _build/checks/properties*
          if-no-files-found: warn
          retention-days: 14

  regex:
    name: Portable regex reference engines
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build the Rust reference engine
        run: cargo build --manifest-path tools/regex-conformance/Cargo.toml --locked --target-dir _build/regex-conformance
      - name: Compile the library and scripts
        run: rebar3 compile
      - name: Check fixture drift
        run: escript scripts/regex/generate_fixture.erl --check
      - name: Check differential matches
        run: escript scripts/regex/check_regex.erl
      - name: Preserve reference engine receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regex-conformance
          path: _build/checks/regex.json
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Native API browser and guide corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Rendered ADR links are checked against their pinned source commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the OTP and Rebar3 versions in .tool-versions
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/tools/ex_doc
          key: exdoc-${{ hashFiles('tools/docs-tool.json') }}
      - name: Compile native documentation chunks
        run: rebar3 compile
      - name: Prepare pinned documentation renderer
        run: escript scripts/docs/build_docs.erl --prepare
      - name: Verify the public API contracts
        run: escript scripts/docs/check_api_docs.escript > _build/api-docs.json
      - name: Check the generated reference
        run: escript scripts/generate/generate_reference.escript --check
      - name: Verify the guide corpus
        run: escript scripts/docs/check_docs.erl
      - name: Render warnings-free API browser
        run: escript scripts/docs/build_docs.erl
      - name: Preserve browser and documentation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-api-browser
          include-hidden-files: true
          path: |
            _build/docs/core
            _build/checks
            _build/api-docs.json
          if-no-files-found: warn
          retention-days: 14
